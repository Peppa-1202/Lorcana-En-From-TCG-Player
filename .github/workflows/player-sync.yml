name: Check and update LorcanaPlayer
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '导出表内 ID、预览 / 补录浏览器批次，或刷新目录'
        type: choice
        default: import_cards
        options:
          - import_cards
          - export_ids
          - refresh_directory
      batch_json:
        description: '仅 import_cards 模式需要粘贴浏览器批次'
        required: false
        type: string
      apply:
        description: '正式补录或刷新目录（默认只检查）'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lorcanaplayer-google-sheet-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test safety checks
        run: python -m unittest discover -s tests -v
      - name: Check or import LorcanaPlayer browser batch
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ vars.SPREADSHEET_ID }}
          MODE: ${{ inputs.mode }}
          APPLY: ${{ inputs.apply }}
          LORCANAPLAYER_BATCH_JSON: ${{ inputs.batch_json }}
        shell: bash
        run: |
          args=()
          if [ "$MODE" = "export_ids" ]; then
            args+=(--export-ids)
          elif [ "$MODE" = "refresh_directory" ]; then
            args+=(--refresh-directory)
          fi
          if [ "$APPLY" = "true" ] && [ "$MODE" != "export_ids" ]; then
            args+=(--apply)
          fi
          python -u import_lorcanaplayer.py "${args[@]}"
      - name: Summary
        if: always()
        run: |
          if [ -f output/player/existing-ids.json ]; then
            printf '### 表内页面 ID\n\n下载下方的 lorcanaplayer-audit，解压后在浏览器选择 existing-ids.json。也可以复制这里的 JSON。\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat output/player/existing-ids.json >> "$GITHUB_STEP_SUMMARY"
            printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f output/player/report.json ]; then
            printf '```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat output/player/report.json >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Audit files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lorcanaplayer-audit
          path: output/player/
          retention-days: 30
